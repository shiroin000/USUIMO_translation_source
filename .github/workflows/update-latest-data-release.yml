name: Update latest-data release

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - '.github/workflows/update-latest-data-release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Uploads replace assets in place; queue runs so two pushes never race on the same release.
concurrency:
  group: data-package-release
  cancel-in-progress: false

jobs:
  update-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read game version line
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re

          # data/Configuration.json is written by the game's editor playtest:
          # {"translationPackage": {"gameVersion": "1.4.4", "tag": "1.4"}}
          tag = ""
          game_version = ""
          try:
              with open("data/Configuration.json", "r", encoding="utf-8") as f:
                  info = json.load(f).get("translationPackage") or {}
              tag = str(info.get("tag") or "").strip()
              game_version = str(info.get("gameVersion") or "").strip()
          except (OSError, ValueError, AttributeError):
              pass

          if not re.fullmatch(r"\d+\.\d+", tag):
              tag = ""
          print(f"tag={tag}")
          print(f"game_version={game_version}")
          PY

      - name: Collect GitHub contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Commit authors per language folder. The game's language screen lists them when a language's
          # systemFeatureText has no translationCredits. Bots and the repository owner are left out.
          python3 - <<'PY' > contributors.json
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["REPO_OWNER"].lower()
          languages = {}
          for lang in sorted(os.listdir("data")):
              if not os.path.isdir(os.path.join("data", lang)):
                  continue
              try:
                  rows = subprocess.run(
                      ["gh", "api", "--paginate", f"repos/{repo}/commits?path=data/{lang}&per_page=100",
                       "--jq", '.[] | [(.author.login // ""), (.author.type // ""), (.commit.author.name // "")] | @tsv'],
                      check=True, capture_output=True, text=True).stdout
              except subprocess.CalledProcessError as error:
                  print(f"::warning::Could not list commits for data/{lang}: {error.stderr.strip()}", file=sys.stderr)
                  continue
              counts = {}
              for row in rows.splitlines():
                  login, kind, name = (row.split("\t") + ["", "", ""])[:3]
                  if kind == "Bot" or login.endswith("[bot]") or name.endswith("[bot]") or login.lower() == owner:
                      continue
                  key = ("login", login) if login else ("name", name.strip())
                  if key[1]:
                      counts[key] = counts.get(key, 0) + 1
              people = [{field: value, "commits": n} for (field, value), n in counts.items()]
              people.sort(key=lambda p: (-p["commits"], (p.get("login") or p.get("name")).lower()))
              if people:
                  languages[lang] = people
          json.dump({"schemaVersion": 1, "repository": repo, "languages": languages}, sys.stdout, ensure_ascii=False, indent=2)
          PY
          python3 -c "import json; d=json.load(open('contributors.json')); print({k: len(v) for k, v in d['languages'].items()})"

      - name: Build data.zip
        run: |
          rm -rf package data.zip data.zip.sha256
          mkdir -p package
          cp -r data package/data
          # Packaging metadata only; installing it would overwrite the player's own Configuration.json.
          rm -f package/data/Configuration.json
          cp contributors.json package/data/TranslationContributors.json
          cd package
          zip -r ../data.zip data
          cd ..
          sha256sum data.zip | awk '{print $1}' > data.zip.sha256

      - name: Publish data packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          GAME_VERSION: ${{ steps.version.outputs.game_version }}
        run: |
          set -euo pipefail

          publish() {
            local tag="$1" title="$2" notes="$3" latest="$4"
            if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Creating release $tag..."
              gh release create "$tag" -R "$GITHUB_REPOSITORY" \
                --title "$title" --notes "$notes" --target "$GITHUB_SHA" --latest="$latest"
            fi
            # --clobber replaces data.zip / data.zip.sha256 that already exist on the release.
            gh release upload "$tag" data.zip data.zip.sha256 -R "$GITHUB_REPOSITORY" --clobber
            echo "Uploaded data.zip to $tag."
          }

          # Always the newest text. Kept for clients released before version-line packages existed.
          publish latest-data "Latest Data Package" \
            "Auto-updated data package for in-game silent updates." true

          # Version-line package: game clients only download the release named after their major version.
          if [ -n "$VERSION_TAG" ]; then
            publish "$VERSION_TAG" "Data Package $VERSION_TAG" \
              "Translation data for game version $VERSION_TAG.x. Game clients on this version line download this package; it stops updating once the game moves to the next version line." false
            echo "Game version $GAME_VERSION -> release $VERSION_TAG"
          else
            echo "::warning::data/Configuration.json has no valid translationPackage.tag; only latest-data was updated."
          fi
